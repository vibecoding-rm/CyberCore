services:
  api:
    build: .
    restart: unless-stopped
    command: >-
      sh -c "python -m scripts.migrate_db &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cybercore:${POSTGRES_PASSWORD:-change_me}@postgres:5432/cybercore
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/opt/cybercore/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybercore
      POSTGRES_USER: cybercore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybercore -d cybercore"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 10g
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["models"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  ollama_data:
