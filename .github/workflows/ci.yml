name: CyberCore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cybercore
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: cybercore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.22

      - name: Lint Python
        run: ruff check app scripts training tests

      - name: Initialize Database Schema & Migrations
        env:
          DATABASE_URL: postgresql://cybercore:change_me@localhost:5432/cybercore
        run: |
          python scripts/migrate_db.py
          python scripts/ingest_vulnerabilities.py --baseline

      - name: Run Pytest Suite
        env:
          CYBERCORE_TEST_DATABASE_URL: postgresql://cybercore:change_me@localhost:5432/cybercore
        run: |
          pytest -v
